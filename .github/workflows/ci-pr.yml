name: CI on PR

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  pmd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Salesforce CLI and Code Analyzer
        run: |
          npm install -g @salesforce/cli@latest
          sf plugins install code-analyzer@latest

      - name: Run PMD
        id: pmd
        uses: forcedotcom/run-code-analyzer@v2
        with:
          run-arguments: --workspace . --rule-selector pmd:Recommended --rule-selector pmd:AppExchange --rule-selector pmd:Custom --view detail --output-file sfca_results.sarif
          results-artifact-name: pmd-results

      - name: Fail on a Critical or High violation
        if: |
          steps.pmd.outputs.exit-code > 0 ||
          steps.pmd.outputs.num-sev1-violations > 0 ||
          steps.pmd.outputs.num-sev2-violations > 0
        run: exit 1

  apex-tests:
    if: github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli@latest

      - name: Authenticate Dev Hub
        env:
          DEVHUB_AUTH_URL: ${{ secrets.DEVHUB_AUTH_URL }}
        run: echo "$DEVHUB_AUTH_URL" | sf org login sfdx-url --sfdx-url-stdin - --alias devhub --set-default-dev-hub

      - name: Create scratch org
        run: sf org create scratch --definition-file config/project-scratch-def.json --set-default --alias scratch-org --duration-days 1

      - name: Deploy source
        run: sf project deploy start

      - name: Run Apex tests
        run: sf apex run test --wait 10 --test-level RunLocalTests --code-coverage --result-format human

      - name: Delete scratch org
        if: always()
        run: sf org delete scratch --no-prompt
